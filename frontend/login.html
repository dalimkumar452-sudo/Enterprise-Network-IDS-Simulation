<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SOC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex h-screen items-center justify-center font-sans relative overflow-hidden">
    <!-- Background styling for pro feel -->
    <div class="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
    <div class="absolute w-96 h-96 bg-blue-600/20 rounded-full blur-3xl -top-20 -left-20"></div>
    
    <div class="glass-panel p-8 rounded-2xl w-full max-w-sm shadow-2xl relative z-10 border-t border-blue-500/30">
        <div class="text-center mb-8">
            <i class="fa-solid fa-shield-halved text-blue-500 text-5xl mb-4 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]"></i>
            <h1 class="text-2xl font-bold text-white tracking-wider">IDS<span class="text-blue-500">SOC</span></h1>
            <p class="text-sm text-gray-400 mt-1">Authorized Personnel Only</p>
        </div>
        <form action="index.html" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email Address</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-3 top-3 text-gray-500"></i>
                    <input type="email" required class="w-full bg-gray-800/50 border border-gray-700 text-white rounded-lg py-2.5 pl-10 pr-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="analyst@soc.local">
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-gray-400 uppercase">Password</label>
                    <a href="#" class="text-xs text-blue-400 hover:text-blue-300">Forgot?</a>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-500"></i>
                    <input type="password" required class="w-full bg-gray-800/50 border border-gray-700 text-white rounded-lg py-2.5 pl-10 pr-3 focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200 mt-2 shadow-[0_0_15px_rgba(59,130,246,0.4)]">
                Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
            </button>
        </form>
        <p class="text-center text-xs text-gray-400 mt-6">
            Don't have an access token? <a href="register.html" class="text-blue-400 hover:text-blue-300 font-semibold">Register</a>
        </p>
    </div>
</body>
</html>
