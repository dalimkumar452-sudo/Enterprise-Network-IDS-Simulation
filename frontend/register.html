<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SOC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex h-screen items-center justify-center font-sans">
    <div class="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <i class="fa-solid fa-shield-halved text-blue-500 text-4xl mb-3"></i>
            <h1 class="text-2xl font-bold text-white tracking-wider">Create Account</h1>
            <p class="text-sm text-gray-400 mt-1">Join the SOC Defense Team</p>
        </div>
        <form action="login.html" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Full Name</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3 top-3 text-gray-500"></i>
                    <input type="text" required class="w-full bg-gray-800/50 border border-gray-700 text-white rounded-lg py-2 pl-10 pr-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Dalim Kumar">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email Address</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-3 top-3 text-gray-500"></i>
                    <input type="email" required class="w-full bg-gray-800/50 border border-gray-700 text-white rounded-lg py-2 pl-10 pr-3 focus:outline-none focus:border-blue-500" placeholder="analyst@soc.local">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-500"></i>
                    <input type="password" required class="w-full bg-gray-800/50 border border-gray-700 text-white rounded-lg py-2 pl-10 pr-3 focus:outline-none focus:border-blue-500" placeholder="••••••••">
                </div>
            </div>
            <div class="flex items-center mt-2">
                <input type="checkbox" required class="w-4 h-4 bg-gray-800 border-gray-700 rounded text-blue-500 focus:ring-blue-500 focus:ring-offset-gray-900">
                <label class="ml-2 text-xs text-gray-400">I agree to the Security Policies & Terms</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-4 shadow-lg shadow-blue-500/30">
                Register Account
            </button>
        </form>
        <p class="text-center text-xs text-gray-400 mt-6">
            Already have an account? <a href="login.html" class="text-blue-400 hover:text-blue-300 font-semibold">Login here</a>
        </p>
    </div>
</body>
</html>
